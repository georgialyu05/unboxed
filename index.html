<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>black friday, unboxed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;            /* page background */
  --ink:#4A4238;           /* text */
  --ink-soft:#A39A8C;      /* secondary text */
  --glass:rgba(255,255,255,.62);
  --glass-line:rgba(255,255,255,.9);
  --accent:#4A4238;        /* button fill */
  --accent-ink:#FFFFFF;    /* button text */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.serif{font-family:'Instrument Serif',serif;font-weight:400}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 28px;z-index:50;pointer-events:none}
.top>*{pointer-events:auto}
.brand{font-family:'Instrument Serif',serif;font-size:26px;letter-spacing:-.01em;cursor:pointer;background:none;border:0}
.brand i{color:var(--ink-soft)}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 6px 20px -8px rgba(74,66,56,.25);font-size:14px;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease}
.pill:hover{box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 26px -10px rgba(74,66,56,.35)}
.pill.solid{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* ---------- stage ---------- */
.view{position:fixed;inset:0;display:none}
.view.on{display:block}
.headline{position:absolute;left:0;right:0;text-align:center;font-family:'Instrument Serif',serif;font-size:clamp(28px,4vw,44px);letter-spacing:-.01em;line-height:1.05}
.headline i{color:var(--ink-soft)}
.hint{position:absolute;left:0;right:0;text-align:center;font-family:'Instrument Serif',serif;font-style:italic;font-size:19px;color:var(--ink-soft);transition:opacity .4s}

/* ---------- envelope ---------- */
.envwrap{position:absolute;left:50%;transform:translateX(-50%);perspective:1600px}
.env{position:relative;width:var(--w);height:calc(var(--w) * var(--ar));perspective:1400px;perspective-origin:50% 44%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.env .ground{position:absolute;left:4%;right:4%;bottom:-3%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(90,75,55,.22),rgba(90,75,55,0));filter:blur(6px)}
.layer{position:absolute;inset:0;background:var(--img) center/100% 100% no-repeat}
.back{clip-path:polygon(var(--bl) var(--bt),var(--br) var(--bt),var(--br) var(--bb),var(--bl) var(--bb));z-index:2}
.back::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(80,65,45,.10),rgba(80,65,45,0) 40%)} /* depth inside the pocket */
.pocket{z-index:4;clip-path:polygon(var(--bl) var(--bt),var(--nl) var(--ny),var(--nr) var(--ny),var(--br) var(--bt),var(--br) var(--bb),var(--bl) var(--bb))}
.pocketshade{position:absolute;inset:0;z-index:4;pointer-events:none;clip-path:polygon(var(--bl) var(--bt),var(--nl) var(--ny),var(--nr) var(--ny),var(--br) var(--bt),var(--br) calc(var(--bt) + 6%),var(--bl) calc(var(--bt) + 6%));
  background:linear-gradient(180deg,rgba(255,255,255,.0),rgba(255,255,255,0))}
.flap{position:absolute;inset:0;z-index:6;transform-style:preserve-3d;transform-origin:50% var(--bt);transform:rotateX(180deg)}
.flap .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flap .in{clip-path:polygon(0 0,100% 0,100% var(--bt),0 var(--bt))}
.flap .out{transform-origin:50% var(--bt);transform:rotateX(180deg);clip-path:polygon(0 var(--bt),100% var(--bt),100% var(--fd),0 var(--fd))}
.flap .out .tex{position:absolute;inset:0;background:var(--img) center/100% 100% no-repeat;transform-origin:50% var(--bt);transform:scaleY(-1);filter:brightness(1.025) saturate(.92)}
.flap .out .sheen{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.45) var(--bt),rgba(255,255,255,0) calc(var(--bt) + 10%),rgba(120,100,75,.06) var(--fd))}
.flapshadow{position:absolute;inset:0;z-index:5;pointer-events:none;clip-path:polygon(calc(var(--bl) + 1%) var(--bt),calc(var(--br) - 1%) var(--bt),var(--fx) calc(var(--fd) + 2.2%));background:rgba(90,72,50,.13);filter:blur(5px);transition:opacity .35s}
.items{position:absolute;inset:0;z-index:3;pointer-events:none}
.env.open .items{pointer-events:auto}

/* ---------- stickers ---------- */
.st{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform;cursor:pointer;pointer-events:auto}
.st img{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(60,45,30,.18)) drop-shadow(0 8px 14px rgba(60,45,30,.16));transition:transform .35s cubic-bezier(.2,1.4,.4,1),filter .35s;user-select:none;-webkit-user-drag:none}
.st:hover img{transform:translateY(-6px) scale(1.06);filter:drop-shadow(0 2px 2px rgba(60,45,30,.16)) drop-shadow(0 18px 24px rgba(60,45,30,.2))}
.st .tag{position:absolute;left:50%;top:100%;transform:translate(-50%,4px);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;padding:6px 12px;border-radius:999px;font-size:12px;
  background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 16px -8px rgba(74,66,56,.3);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.st:hover .tag{opacity:1;transform:translate(-50%,10px)}
.st.loading img{opacity:.0}
.st.loading::before{content:"";position:absolute;inset:8%;border-radius:22px;background:linear-gradient(100deg,rgba(255,255,255,.4) 30%,rgba(255,255,255,.95) 50%,rgba(255,255,255,.4) 70%) 0 0/300% 100%,rgba(236,230,220,.6);
  animation:shimmer 1.2s linear infinite;box-shadow:0 8px 20px -10px rgba(74,66,56,.3)}
@keyframes shimmer{to{background-position:-300% 0,0 0}}
@keyframes bob{from{translate:0 0}to{translate:0 -5px}}
.st.idle{animation:bob 3.2s ease-in-out infinite alternate}

/* ---------- home: everyone's envelopes ---------- */
.wall{position:absolute;inset:150px 0 0 0;overflow-y:auto;padding:10px 40px 120px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:34px 30px}
.mini{width:170px;cursor:pointer;text-align:center;background:none;border:0;padding:0}
.mini .envwrap{position:relative;left:auto;transform:none;margin:0 auto}
.mini:hover .env{transform:translateY(-6px) rotate(-2deg)}
.mini .who{margin-top:14px;font-family:'Instrument Serif',serif;font-size:20px}
.mini .n{font-size:12px;color:var(--ink-soft);margin-top:2px}

/* ---------- composer ---------- */
.composer{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:6px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass);
  backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 16px 40px -16px rgba(74,66,56,.35);z-index:40}
.composer input{border:0;background:transparent;outline:none;height:40px;padding:0 14px;font-size:14px}
.composer input::placeholder{color:var(--ink-soft)}
.composer .name{width:120px;border-right:1px solid rgba(74,66,56,.1)}
.composer .link{width:min(340px,40vw)}
.composer .pill{box-shadow:none;height:40px}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,10px);opacity:0;transition:.3s;font-size:13px;padding:10px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.drop{display:none}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="home">black friday, <i>unboxed</i></button>
  <button class="pill solid" id="mk">+ my envelope</button>
</header>

<!-- home -->
<section class="view" id="v-home">
  <h1 class="headline" style="top:92px">what everyone <i>bought</i></h1>
  <div class="wall" id="wall"></div>
</section>

<!-- one envelope -->
<section class="view" id="v-env">
  <h1 class="headline" id="who" style="top:84px"></h1>
  <div class="envwrap" id="stage1"></div>
  <p class="hint" id="hint1">tap to open</p>
</section>

<!-- make yours -->
<section class="view" id="v-new">
  <h1 class="headline" style="top:84px">what did <i>you</i> get?</h1>
  <div class="envwrap" id="stage2"></div>
  <div class="composer">
    <input class="name" id="nm" placeholder="your name" maxlength="24">
    <input class="link" id="ln" placeholder="paste a link…">
    <button class="pill" id="add">add</button>
    <button class="pill solid" id="seal" style="display:none">seal it</button>
  </div>
  <input type="file" accept="image/*" class="drop" id="file">
</section>
<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
